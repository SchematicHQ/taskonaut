name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - next

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

# Never publish two releases concurrently; queue instead of cancelling so a
# push that lands mid-release still gets released.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # Skip releases for chore(*) merges (dependabot bumps, release commits).
    # These ride along with the next real feat/fix release instead.
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(') || github.event_name == 'workflow_dispatch' }}
    runs-on: runs-on=${{ github.run_id }}/runner=1cpu-linux-arm64
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: lts/*
          registry-url: "https://registry.npmjs.org"
          cache: "npm"
      # Reproducible install from the lockfile: a release must build the
      # dependency tree the PR checks validated.
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm audit signatures
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Disable npm provenance attestation: it requires a GitHub-hosted
          # runner and we use a self-hosted RunsOn runner. OIDC auth still works.
          NPM_CONFIG_PROVENANCE: "false"
        run: npm run semantic-release
