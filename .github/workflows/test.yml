name: Test

# Least privilege: this workflow only reads the repository.
permissions:
  contents: read

on:
  pull_request:
    branches: [main]

# Supersede in-flight runs when a PR is pushed to again.
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: runs-on=${{ github.run_id }}/runner=1cpu-linux-arm64
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      # `format -- --check` expanded to `prettier --write ... --check`, which
      # rewrites files and always exits 0. format:check is a real gate.
      - name: Check formatting
        run: npm run format:check

      # Coverage is enforced by a threshold in jest.config.js, so a change that
      # adds untested behaviour to the destructive commands fails here.
      - name: Run tests
        run: npm run test:coverage
