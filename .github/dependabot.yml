version: 2
updates:
  - package-ecosystem: "npm"
    versioning-strategy: increase
    directories:
      - "/"
    # Nothing first-party lives here, so a weekly run only caps the noise:
    # security updates still arrive on their own schedule.
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels:
      - "npm"
      - "Dependabot"
    assignees:
      - "mhmdio"
    groups:
      # @aws-sdk/* ships a release most days and every package moves together,
      # so client-ecs and credential-providers used to land as a pair of PRs.
      aws-sdk:
        patterns:
          - "@aws-sdk/*"
      # Majors stay out so they still arrive on their own.
      dev-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels:
      - "github-actions"
      - "Dependabot"
    assignees:
      - "mhmdio"
    groups:
      actions:
        patterns:
          - "*"
        update-types: ["minor", "patch"]
